name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright-core install chromium
      - run: npm run typecheck
      - run: npm run build:ui
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      # Failures as annotations, so they show on the run page without opening the log.
      - name: Summarize failures
        if: failure()
        shell: bash
        run: grep -E -B2 -A12 "^not ok|✖ " test.log | head -80 | sed 's/^/::error::/' || true
